<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="560" rx="10" fill="#16181c"/>
  <text x="28" y="44" fill="#6b7078" font-size="13" font-weight="600" letter-spacing="3">UNIVERSAL PLAYER — RETICLE STATES (DESKTOP / GAMEPAD)</text>

  <!-- ===================== row 1 ===================== -->

  <!-- RESTING: static white ring -->
  <g>
    <circle cx="200" cy="170" r="16" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="200" y="232" fill="#c9ccd1" font-size="13" font-weight="600" letter-spacing="1.5" text-anchor="middle">RESTING</text>
    <text x="200" y="252" fill="#6b7078" font-size="11" letter-spacing="1" text-anchor="middle">WHITE RING — NOTHING AIMED</text>
  </g>

  <!-- HOVER: white -> green over a usable object -->
  <g>
    <rect x="505" y="172" width="40" height="30" rx="5" fill="none" stroke="#4a4f58" stroke-width="2">
      <animate attributeName="stroke" values="#4a4f58;#4a4f58;#59F299;#59F299;#4a4f58;#4a4f58" keyTimes="0;0.18;0.28;0.68;0.78;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0.6;1;1;0.6;0.6" keyTimes="0;0.18;0.28;0.68;0.78;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="500" cy="170" r="16" fill="none" stroke="#ffffff" stroke-width="3">
      <animate attributeName="stroke" values="#ffffff;#ffffff;#59F299;#59F299;#ffffff;#ffffff" keyTimes="0;0.18;0.28;0.68;0.78;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="500" y="232" fill="#59F299" font-size="13" font-weight="600" letter-spacing="1.5" text-anchor="middle">HOVER</text>
    <text x="500" y="252" fill="#6b7078" font-size="11" letter-spacing="1" text-anchor="middle">TINTS GREEN OVER ANYTHING USABLE</text>
    <text x="500" y="270" fill="#6b7078" font-size="11" letter-spacing="1" text-anchor="middle">INTERACTABLES · SEATS · PICKABLES · TOOLTIPS</text>
  </g>

  <!-- CLICK: green -> gold + shrinks to 0.75x while held -->
  <g transform="translate(800,170)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#59F299" stroke-width="3">
      <animate attributeName="stroke" values="#59F299;#59F299;#FFD940;#FFD940;#59F299;#59F299" keyTimes="0;0.2;0.26;0.6;0.68;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1;1;0.75;0.75;1;1" keyTimes="0;0.2;0.26;0.6;0.68;1"
      calcMode="spline" keySplines="0.4 0 0.6 1;0.2 0.8 0.3 1;0.4 0 0.6 1;0.2 0.8 0.3 1;0.4 0 0.6 1"
      dur="2.8s" repeatCount="indefinite"/>
  </g>
  <text x="800" y="232" fill="#FFD940" font-size="13" font-weight="600" letter-spacing="1.5" text-anchor="middle">CLICK (HELD)</text>
  <text x="800" y="252" fill="#6b7078" font-size="11" letter-spacing="1" text-anchor="middle">GOLD + SHRINKS TO 0.75× WHILE THE</text>
  <text x="800" y="270" fill="#6b7078" font-size="11" letter-spacing="1" text-anchor="middle">INTERACT / TAKE BUTTON IS DOWN</text>

  <!-- ===================== row 2 ===================== -->

  <!-- INVALID: flashes pinkish red 0.35s, then back -->
  <g>
    <circle cx="200" cy="390" r="16" fill="#FF4761" fill-opacity="0" stroke="#ffffff" stroke-width="3">
      <animate attributeName="stroke" values="#ffffff;#ffffff;#FF4761;#FF4761;#ffffff;#ffffff" keyTimes="0;0.3;0.32;0.46;0.54;1" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0;0;0.35;0;0" keyTimes="0;0.3;0.34;0.46;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="200" y="452" fill="#FF4761" font-size="13" font-weight="600" letter-spacing="1.5" text-anchor="middle">INVALID REQUEST</text>
    <text x="200" y="472" fill="#6b7078" font-size="11" letter-spacing="1" text-anchor="middle">0.35 s FLASH WHEN A CLICK IS REJECTED</text>
    <text x="200" y="490" fill="#6b7078" font-size="10" letter-spacing="0.5" text-anchor="middle" font-family="Consolas, monospace">PlayerEvents.RaiseInvalidAction()</text>
  </g>

  <!-- TABLET / ITEM DRAWN: ring eases into a filled dot -->
  <g>
    <circle cx="500" cy="390" r="16" fill="#ffffff" fill-opacity="0" stroke="#ffffff" stroke-width="3">
      <animate attributeName="fill-opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.3;0.65;0.78;1"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.2 0.8 0.3 1;0.4 0 0.6 1;0.2 0.8 0.3 1;0.4 0 0.6 1"
        dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="500" y="452" fill="#c9ccd1" font-size="13" font-weight="600" letter-spacing="1.5" text-anchor="middle">PRIMARY ITEM DRAWN</text>
    <text x="500" y="472" fill="#6b7078" font-size="11" letter-spacing="1" text-anchor="middle">RING EASES INTO A FILLED DOT — SAME COLORS,</text>
    <text x="500" y="490" fill="#6b7078" font-size="11" letter-spacing="1" text-anchor="middle">THE CURSOR IS FREE OVER THE TABLET</text>
  </g>

  <!-- GAZE VALIDATION: radial fill sweeps, then validates -->
  <g>
    <circle cx="800" cy="390" r="16" fill="none" stroke="#4a4f58" stroke-width="3"/>
    <g transform="rotate(-90 800 390)">
      <circle cx="800" cy="390" r="16" fill="none" stroke="#59F299" stroke-width="3" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.08;0.6;1" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="1;1;1;0;0" keyTimes="0;0.6;0.78;0.88;1" dur="3.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle cx="800" cy="390" r="16" fill="#59F299" fill-opacity="0" stroke="none">
      <animate attributeName="fill-opacity" values="0;0;0.5;0;0" keyTimes="0;0.6;0.66;0.82;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <text x="800" y="452" fill="#59F299" font-size="13" font-weight="600" letter-spacing="1.5" text-anchor="middle">GAZE VALIDATION</text>
    <text x="800" y="472" fill="#6b7078" font-size="11" letter-spacing="1" text-anchor="middle">HOLD YOUR AIM — THE RING FILLS UP,</text>
    <text x="800" y="490" fill="#6b7078" font-size="11" letter-spacing="1" text-anchor="middle">THEN THE ACTION VALIDATES</text>
  </g>

  <!-- footnotes -->
  <g font-size="11" letter-spacing="1" fill="#6b7078">
    <text x="500" y="530" text-anchor="middle">COLORS ARE THE CURSORSTATECONTROLLER DEFAULTS (TUNABLE PER PROJECT) · TRANSITIONS ARE EASED, NOT SNAPPED</text>
    <text x="972" y="548" text-anchor="end">VR HIDES THE RETICLE — REJECTED VR ACTIONS SIGNAL ON THE INTERACTABLE</text>
  </g>
</svg>
